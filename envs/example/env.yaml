schema_version: 1
environment:
  id: example
name: example
rancher_url: rancher.example.internal

infra:
  vsphere:
    # Prefer TF_VAR_vsphere_server, TF_VAR_vsphere_user, and
    # TF_VAR_vsphere_password from .envrc instead of storing them here.
    # server: vcenter.example.internal
    # user: administrator@example.internal
    allow_unverified_ssl: true
    datacenter: DC1
    datastore: DATASTORE1
    resource_pool: CLUSTER1/Resources
    folder: Rancher/example
  networks:
    customer: CUSTOMER_VLAN_PORTGROUP
    management: MANAGEMENT_VLAN_PORTGROUP
  templates:
    infra: template-bastion-prom
    rke2: template-rke2

ssh:
  # user: root
  # private_key: ~/.ssh/id_rsa
  # Terraform runs from the operator workstation. pyinfra can still run from
  # there by using this SSH path: workstation -> jump_host -> bastion1,
  # and workstation -> jump_host -> bastion1 -> local nodes.
  # Keep real jump host names/IPs in an untracked env under envs/private/.
  # If the full route is already in ~/.ssh/config, use only its alias here.
  # jump_host: existing-ssh-config-alias
  bastion_proxy_roles:
    - prometheus
    - rancher

prompt:
  # colors:
  #   user: 183
  #   at: 135
  #   host: 129
  #   path: 141

local:
  vlan:
    cidr: 10.14.17.0/28
    gateway_host: 1
    # dns_nodes:
    #   - bastion1
  rancher_nodes:
    name_prefix: rancher
    count: 3
    start_host: 11
    template: rke2
    cpu: 4
    memory_mb: 16384
    disk_gb: 100
    nics:
      - network: customer

nodes:
  bastion1:
    role: bastion
    template: infra
    host: 4
    # Management/vSphere DNS for bastion OS, Squid, and clone customization.
    # Local nodes use bastion1 as DNS instead.
    dns_servers:
      - 192.0.2.53
    cpu: 2
    memory_mb: 4096
    disk_gb: 80
    nics:
      - network: customer
      - network: management
        # Use static management addressing for SSH access when possible.
        # cidr: 192.0.2.10/24
  prom1:
    role: prometheus
    template: infra
    host: 6
    cpu: 2
    memory_mb: 8192
    disk_gb: 100
    nics:
      - network: customer

bastion:
  service_node: bastion1
  # DNS exposed to local clients through dnsmasq. This is intentionally
  # separate from bastion1 DNS so local clients do not inherit vSphere DNS.
  dnsmasq_upstream_servers:
    - 192.0.2.54
  # Optionally rename NetworkManager connection profiles on bastion for clarity.
  # Keys are current device names or profile names; values are target profile names.
  # network_connection_names:
  #   ens192: local
  #   ens224: mgmt
  vsphere_route: 192.0.2.128/26 192.0.2.1
  vsphere_route_connection: ens224
  # squid_http_port: 3128

rke2:
  # primary_node defaults to the first generated Rancher node.
  # primary_node: rancher1
  version: v1.35.7+rke2r1
  token: example-rke2-token-change-me
  # token_file: /etc/rancher/rke2/token
  # selinux: true

rancher:
  edition: community
  # agent_tls_mode: system-store
  # bootstrap_password is a one-time initial admin password. Keep real values
  # only in private/untracked env configs and change it after first login.
  # bootstrap_password: change-me-on-first-login
  # cert_manager_version: v1.15.3
  editions:
    community:
      repo_name: rancher-stable
      repo_url: https://releases.rancher.com/server-charts/stable
      version: 2.9.2
    prime:
      repo_name: rancher-prime
      repo_url: https://charts.rancher.com/server-charts/prime
      version: 2.9.2
